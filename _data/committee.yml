chairs:
  - name: Tommaso Puccetti
    role: Workshop Co-chair
    affiliation: University of Florence, Italy
    photo: "/assets/img/tommaso-puccetti.jpg"
    bio: >-
      Tommaso Puccetti is a Postdoctoral Researcher at the Department of Mathematics and Computer Science of the University of Florence, Italy, where he received his PhD in Computer Science in 2026.
      His research focuses on two main areas: the verification and validation of railway systems in compliance with safety-critical standards,
      and the development of Machine Learning-based network intrusion detection techniques to enhance cybersecurity. His work combines methodological approaches with practical implementations.
      Over the past five years, he has contributed to several research and industrial projects in the railway domain, 
      collaborating with Rete Ferroviaria Italiana (RFI) on certification, verification, and validation processes. 
      He has also participated in national and European research initiatives, including SPaCe, PRIN FLEGREA, and the ECM ERTMS Evolution Program.
      He actively contributes to the international research community as a member of the Technical Program Committees of conferences and workshops in cybersecurity, dependable systems, and artificial intelligence.
  - name: Eirini Liotou
    role: Workshop Co-chair
    affiliation: Harokopio University of Athens, Greece
    photo: "" # optional, e.g. /assets/img/eirini-liotou.jpg
    bio: >-
      Eirini Liotou is an Assistant Professor at the Department of Informatics
      and Telematics of Harokopio University of Athens since 2024. She holds a
      PhD from the Department of Informatics and Telecommunications at the
      National and Kapodistrian University of Athens, an MSc in Informatics and
      Telecommunications from the same university, an MSc in Communications and
      Signal Processing from Imperial College London, and a Diploma in
      Electrical and Computer Engineering from the National Technical University
      of Athens. She has worked as a Senior Software Engineer at Siemens
      Enterprise Communications (R&D), as a Post-Doc researcher at NKUA, and as
      a Scientific Project Manager for EU research projects at ICCS. She has
      authored more than 30 peer-reviewed publications and serves as an EC
      expert reviewer. Her research interests revolve around 6G mobile
      networks, SDN, NFV, AI in networking and network emulation, as well as
      Software-Defined Vehicles (SDVs) and V2X communications.
  - name: Mario Conci
    role: Workshop Co-chair
    affiliation: Spindox Labs, Italy
    photo: ""
    bio: >-
      Mario Conci works as EU Project Manager at Spindox Labs. He has extensive
      experience in European research and innovation projects, stakeholder
      engagement and community building. Over the years, he has designed,
      organised and supported workshops, collaborative sessions and project
      events involving research organisations, public authorities and
      companies, across areas such as smart cities and digital innovation.
  - name: Maria Papaioannou
    role: Workshop Co-chair
    affiliation: University of Denmark
    photo: ""
    bio: >-
      Maria Papaioannou is a Postdoctoral Researcher at DTU Compute, Technical University of Denmark. She received her PhD in Engineering from the University of Greenwich, UK, in 2024, and holds a Diploma in Electrical and Computer Engineering and an MSc in Biomedical Engineering from the University of Patras, Greece. Her research focuses on cybersecurity and privacy for cyber-physical and software-defined systems, AI-driven security mechanisms, anomaly detection, user authentication, and usable security. She currently contributes to the Chips JU Shift2SDV project, working on security and dependability aspects of software-defined vehicle architectures. She has participated in several European and national research projects, including SECREDAS, Moore4Medical, and 5G-MOBILIZADOR, and has authored more than 30 journal and conference publications.
      She is actively involved in research community service, serving on the Program/Technical Program Committees of conferences including ESORICS 2026, ICT 2026, IFIP Networking 2026, IFIP SEC 2025, IEEE CAMAD, and IEEE MeditCom, as well as acting as a reviewer for international conferences and journals. She also served as Session Chair for the IS6G-PHYSEC Workshop at IEEE GLOBECOM 2023. In addition, she has experience organizing international educational and collaborative activities under the Erasmus+ programme.
  - name: Pedro Ferreira do Souto
    role: Workshop Co-chair
    affiliation: University of Porto, Portugal
    photo: ""
    bio: >-
      Pedro Ferreira do Souto is an Assistant Professor of the Department of Informatics Engineering of the Faculty of Engineering of the University of Porto. He holds a Ph.D. in Computer Science of the State University of New York at Stony Brook. His main research interests are on real-time systems scheduling and on distributed systems with a focus on fault-tolerance and anomaly detection. He has served on the Technical Program Committee of several IEEE ETFA conferences and acted as reviewer of international conferences and journals, such as the Journal of Systems Architecture.

